    --text-muted:#5E6F63;
    --accent:#BD4E1C;
    --accent-ink:#FFFFFF;
    --accent-2:#8F6F1E;

    --success-bg:#E4EEE3;
    --danger:#AE3A2D;
    --danger-bg:#F6E4E0;

    --tribe-4:#7A4F6B;

    --tribe-2:#D7A754;
    --tribe-3:#9CB15C;
    --tribe-4:#B37AA8;
    --tribe-5:#5FCBBB;
    --tribe-6:#D28A6E;
    --tribe-none:#8CA198;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 10px 30px -10px rgba(0,0,0,0.6);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Work Sans", ui-sans-serif, system-ui, sans-serif;
    font-size:15px;
    line-height:1.5;
    min-height:100%;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }
  a{color:var(--accent);}
  .num{font-family:"IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums;}
  .display{font-family:"Big Shoulders Display", ui-sans-serif, sans-serif; letter-spacing:0.01em;}
  button, select, input, textarea{font-family:inherit; font-size:inherit; color:inherit;}
  button{cursor:pointer;}
  button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, .chip:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px;
  }

  #app{max-width:1080px; margin:0 auto; padding:0 20px 64px;}

  /* ---- top bar ---- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
    padding:22px 0 16px; border-bottom:1px solid var(--border);
    margin-bottom:4px;
  }
  .brand{display:flex; align-items:center; gap:12px; min-width:0;}
  .torch{width:34px; height:34px; flex:none;}
  .brand-text{min-width:0;}
  .brand-text h1{
    font-family:"Big Shoulders Display"; font-weight:900; font-size:30px; line-height:1;
    margin:0; letter-spacing:0.01em;
  }
  .brand-text .sub{
    display:block; font-size:11px; letter-spacing:0.12em; text-transform:uppercase;
    color:var(--text-muted); margin-top:3px; font-weight:600; white-space:nowrap;
  }
  .viewer{display:flex; align-items:center; gap:10px; flex:none;}
  .viewer-avatar{
    width:34px; height:34px; border-radius:50%; flex:none; background:var(--accent); color:var(--accent-ink);
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px;
  }
  .viewer-name{font-weight:600; font-size:14px; white-space:nowrap;}
  .role-pill{
    font-size:10.5px; text-transform:uppercase; letter-spacing:0.07em; font-weight:700;
    padding:3px 8px; border-radius:100px; background:var(--accent); color:var(--accent-ink);
    white-space:nowrap; display:inline-block;
  }
  .logout-link{font-size:12px; color:var(--text-muted); white-space:nowrap; text-decoration:underline; cursor:pointer; background:none; border:none; padding:0; font-weight:600;}
  @media (max-width:480px){
    .topbar{justify-content:flex-start;}
    .brand-text h1{font-size:24px;}
  }

  /* ---- tabs ---- */
  .tabs{
    display:flex; gap:4px; overflow-x:auto; padding:14px 0; margin-bottom:18px;
    border-bottom:1px solid var(--border);
    -ms-overflow-style:none; scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab-btn{
    background:none; border:none; padding:9px 15px; border-radius:100px;
    font-weight:600; font-size:13.5px; color:var(--text-muted); white-space:nowrap;
    transition:background .15s, color .15s;
  }
  .tab-btn:hover{background:var(--surface-2); color:var(--text);}
  .tab-btn.active{background:var(--accent); color:var(--accent-ink);}

  /* ---- generic ---- */
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:20px; box-shadow:var(--shadow); margin-bottom:16px;
  }
  .card h2{font-family:"Big Shoulders Display"; font-weight:800; font-size:22px; margin:0 0 4px; text-wrap:balance;}
  .card h3{font-size:14px; font-weight:700; margin:0 0 10px;}
  .muted{color:var(--text-muted);}
  .small{font-size:12.5px;}
  .row{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .between{justify-content:space-between;}
  .stack{display:flex; flex-direction:column; gap:14px;}
  .grid-cols{display:grid; gap:14px;}
  .empty-state{
    text-align:center; padding:40px 20px; color:var(--text-muted);
  }
  .empty-state .glyph{font-size:30px; margin-bottom:8px; display:block;}

  .btn{
    border:1px solid var(--border); background:var(--surface-2); color:var(--text);
    padding:9px 16px; border-radius:10px; font-weight:600; font-size:13.5px;
    transition:transform .1s, background .15s;
  }
  .btn:hover{background:var(--border);}
  .btn:active{transform:scale(0.98);}
  .btn.primary{background:var(--accent); color:var(--accent-ink); border-color:transparent;}
  .btn.primary:hover{filter:brightness(1.07);}
  .btn.danger{background:var(--danger-bg); color:var(--danger); border-color:transparent;}
  .btn:disabled{opacity:0.45; cursor:not-allowed;}
  .btn.sm{padding:6px 11px; font-size:12px;}

  .pill{
    display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:100px;
    font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em;
  }
  .pill.live{background:var(--success-bg); color:var(--success);}
  .pill.closed{background:var(--border); color:var(--text-muted);}
  .pill.danger{background:var(--danger-bg); color:var(--danger);}
  .dot{width:8px; height:8px; border-radius:50%; flex:none; display:inline-block;}

  label.field-label{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-muted); display:block; margin-bottom:8px;}

  /* castaway chip picker */
  .tribe-group{margin-bottom:12px;}
  .tribe-group:last-child{margin-bottom:0;}
  .tribe-heading{
    display:flex; align-items:center; gap:7px; margin-bottom:8px;
    font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.07em; color:var(--text-muted);
  }
  .tribe-heading .dot{width:9px; height:9px;}
  .chip-grid{display:flex; flex-wrap:wrap; gap:7px;}
  .chip{
    border:1px solid var(--border); background:var(--surface-2); border-radius:100px;
    padding:5px 14px 5px 5px; font-size:13px; font-weight:600; display:inline-flex; align-items:center; gap:7px;
    transition:border-color .15s, background .15s;
  }
  .chip:hover{border-color:var(--accent);}
  .chip.selected{background:var(--accent); color:var(--accent-ink); border-color:transparent;}
  .chip.selected .avatar{box-shadow:0 0 0 2px var(--accent-ink);}
  .chip.eliminated{opacity:0.5;}
  .chip.eliminated .avatar img{filter:grayscale(1);}
  .chip.nopick{font-style:italic; padding-left:9px;}
  .avatar{
    width:26px; height:26px; border-radius:50%; flex:none; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    background:var(--border); box-shadow:0 0 0 2px var(--tribe-ring, var(--border));
  }
  .avatar img{width:100%; height:100%; object-fit:cover; display:block;}
  .avatar.nopick-glyph{background:var(--surface); color:var(--text-muted); font-size:13px; box-shadow:0 0 0 2px var(--border);}

  /* profile-card style picker, used on the My Picks page */
  .pick-card-grid{display:flex; flex-wrap:wrap; gap:8px;}
  .pick-card{
    width:78px; display:flex; flex-direction:column; align-items:center; gap:6px;
    padding:9px 6px 8px; border:1px solid var(--border); border-radius:12px; background:var(--surface-2);
    text-align:center; transition:border-color .15s, background .15s;
  }
  .pick-card:hover{border-color:var(--accent);}
  .pick-card.selected{background:var(--accent); border-color:transparent;}
  .pick-card.selected .pick-card-name, .pick-card.selected .pick-card-pts{color:var(--accent-ink);}
  .pick-card.selected .avatar-md{box-shadow:0 0 0 2px var(--accent-ink);}
  .pick-card.eliminated, .pick-card.unavailable{opacity:0.5;}
  .pick-card.eliminated .avatar-md img, .pick-card.unavailable .avatar-md img{filter:grayscale(1);}
  .pick-card-name{font-size:12px; font-weight:700; line-height:1.2;}
  .pick-card-pts{font-size:10.5px; font-weight:600; color:var(--text-muted); font-family:"IBM Plex Mono", monospace;}
  .avatar-md{
    width:48px; height:48px; border-radius:50%; flex:none; overflow:hidden;
    display:flex; align-items:center; justify-content:center; background:var(--border);
    box-shadow:0 0 0 2px var(--tribe-ring, var(--border));

  .avatar-md img{width:100%; height:100%; object-fit:cover; display:block;}
  .avatar-md.nopick-glyph{background:var(--surface); color:var(--text-muted); font-size:18px; box-shadow:0 0 0 2px var(--border);}

  /* per-player results rows on the Episode Results tab */
  .pr-row{display:flex; align-items:flex-start; gap:12px; padding:12px 0; border-bottom:1px solid var(--border); flex-wrap:wrap;}
  .pr-row:last-child{border-bottom:none;}
  .pr-player{min-width:120px; font-weight:700; font-size:13px; display:flex; align-items:center; gap:8px; flex:none;}
  .pr-cards{display:flex; gap:6px; flex-wrap:wrap; flex:1; align-items:center;}
  .pr-card{
    display:inline-flex; align-items:center; gap:5px; padding:4px 10px 4px 4px; border-radius:100px;
    font-size:12px; font-weight:600; border:1px solid var(--border); background:var(--surface-2);
  }
  .pr-card.correct{background:var(--success-bg); border-color:transparent; color:var(--success);}
  .pr-card.incorrect{background:var(--danger-bg); border-color:transparent; color:var(--danger);}
  .pr-card.nopick{color:var(--text-muted); font-style:italic;}
  .pr-card.mvp{background:color-mix(in srgb, var(--accent) 15%, transparent); border-color:transparent; color:var(--accent);}
  .pr-cat{font-size:9px; text-transform:uppercase; letter-spacing:0.05em; opacity:0.75; margin-right:1px;}
  .pr-avatar{width:20px; height:20px; border-radius:50%; flex:none; overflow:hidden; display:flex; align-items:center; justify-content:center; background:var(--border);}
  .pr-avatar img{width:100%; height:100%; object-fit:cover; display:block;}
  .pr-none{font-size:12.5px; color:var(--text-muted); font-style:italic;}
  .pr-total{font-size:14px; font-weight:800; color:var(--text); flex:none; margin-left:auto; padding-left:8px; white-space:nowrap;}

  select.native{
    width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--border);
    background:var(--surface-2); color:var(--text); appearance:none;
  }
  input.native, textarea.native{
    width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--border);
    background:var(--surface-2); color:var(--text);
  }

  table{width:100%; border-collapse:collapse; font-size:13.5px; table-layout:fixed;}
  thead th{
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.05em;
    color:var(--text-muted); font-weight:700; padding:0 10px 8px; border-bottom:1px solid var(--border);
  }
  tbody td{padding:11px 10px; border-bottom:1px solid var(--border); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  tbody tr:last-child td{border-bottom:none;}
  .table-wrap{overflow-x:auto;}
  td.num, th.num{text-align:center;}
  tr.me{background:var(--surface-2);}
  .rank{font-family:"Big Shoulders Display"; font-weight:800; font-size:17px;}

  .divider{height:1px; background:var(--border); margin:18px 0;}

  .banner{
    border:1px dashed var(--accent); border-radius:var(--radius); padding:16px 18px;
    background:var(--surface-2); margin-bottom:16px; display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
  }

  .castaway-card{
    border:1px solid var(--border); border-radius:12px; background:var(--surface-2);
    padding:12px; display:flex; flex-direction:column; gap:8px; align-items:center; text-align:center;
  }
  .castaway-name{font-weight:700; font-size:14px;}
  .avatar-lg{
    width:64px; height:64px; border-radius:50%; flex:none; overflow:hidden;
    display:flex; align-items:center; justify-content:center; background:var(--border);
    box-shadow:0 0 0 3px var(--tribe-ring, var(--border));

  .avatar-lg img{width:100%; height:100%; object-fit:cover; display:block;}
  .castaway-card.eliminated-card .avatar-lg img{filter:grayscale(1);}
  .castaway-card.eliminated-card .avatar-lg{opacity:0.55;}
  .tribe-input{
    width:100%; padding:6px 9px; border-radius:8px; border:1px solid var(--border);
    background:var(--surface); color:var(--text); font-size:12.5px; text-align:center;
  }

  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media (max-width:640px){.form-grid{grid-template-columns:1fr;}}

  .admin-section{padding-top:4px;}
  .admin-section + .admin-section{margin-top:22px; border-top:1px solid var(--border); padding-top:22px;}

  footer.note{text-align:center; color:var(--text-muted); font-size:12px; margin-top:28px;}

  /* ---- auth screen ---- */
  .auth-wrap{max-width:380px; margin:60px auto 0; padding:0 20px;}
  .auth-brand{display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:24px; text-align:center;}
  .auth-brand .torch{width:40px; height:40px;}
</style>
</head>

      else if (attrs[k] === true) e.setAttribute(k, "");
      else e.setAttribute(k, attrs[k]);

  function countdown(iso){
    if (!iso) return null;
    var ms = new Date(iso).getTime() - Date.now();
    if (isNaN(ms)) return null;
    if (ms <= 0) return "closed";
    var mins = Math.floor(ms/60000);
    var days = Math.floor(mins/1440); mins -= days*1440;
    var hrs = Math.floor(mins/60); mins -= hrs*60;
    var parts = [];
    if (days) parts.push(days+"d");
    if (hrs || days) parts.push(hrs+"h");
    parts.push(mins+"m");
    return parts.join(" ");

  /* =========================================================================
     SCORING ENGINE (unchanged from the original — storage-agnostic)
  ========================================================================= */
  function catPoints(ep, cat){
    if (cat === "votedOff") return 100;
    if (cat === "safe") return 10 * ep.number;
    if (cat === "winner") return 500;
    var merged = !!ep.merged;
    if (cat === "reward" || cat === "immunity") return merged ? 100 : 50;
    if (cat === "mystery") return merged ? 200 : 100;
    return 0;
  }
  function perfectBonus(ep){ return ep.merged ? 200 : 100; }

  function isCorrect(ep, cat, pickVal){
    if (cat === "safe"){
      var voted = (ep.results && ep.results.votedOff) || [];
      return !!pickVal && pickVal !== NO_PICK && voted.indexOf(pickVal) === -1;
    }
    var arr = (ep.results && ep.results[cat]) || [];
    if (pickVal === NO_PICK || !pickVal) return arr.length === 0;
    return arr.indexOf(pickVal) !== -1;
  }

  function mvpStreaks(sortedEpisodes, picksByEp){
    var streak = 0, lastMvp = null;
    var out = {};
    sortedEpisodes.forEach(function(ep){
      var pick = picksByEp[ep.number];
      if (!pick || !pick.mvp){ streak = 0; lastMvp = null; out[ep.number] = 0; return; }
      if (pick.mvp === lastMvp && streak > 0) streak += 1; else streak = 1;
      lastMvp = pick.mvp;
      out[ep.number] = streak;
    });
    return out;
  }

  function scorePlayer(userId, picksByEp, adjustments){
    var sorted = episodeList();
    var streaks = mvpStreaks(sorted, picksByEp);
    var perEpisode = [];
    var totals = {points:0, perfectPicks:0, mysteryCorrect:0};

    sorted.forEach(function(ep){
      var pick = picksByEp[ep.number];
      if (!ep.locked) return;

      if (!pick){
        perEpisode.push({episode:ep.number, submitted:false, lines:[], subtotal:0, perfect:false, mvpBonus:0, adjustment:0, total:0});
        return;
      }

      var lines = [];
      var categoryPts = 0;
      var allCorrect = true;
      CATS.forEach(function(cat){
        var val = pick[cat];
        var pts = catPoints(ep, cat);
        var ok = isCorrect(ep, cat, val);
        if (!ok) allCorrect = false;
        var earned = ok ? pts : 0;
        categoryPts += earned;
        lines.push({cat:cat, label:CAT_LABEL[cat], pick:val, correct:ok, pts:earned, max:pts});
        if (cat === "mystery" && ok) totals.mysteryCorrect += 1;
      });

      if (ep.isFinale){
        var wOk = isCorrect(ep, "winner", pick.winner);
        var wPts = wOk ? 500 : 0;
        categoryPts += wPts;
        lines.push({cat:"winner", label:"Sole Survivor", pick:pick.winner, correct:wOk, pts:wPts, max:500});
        if (wOk && pick.winner){
          var usedBefore = sorted.filter(function(e){return e.number < ep.number;}).some(function(e){
            var p = picksByEp[e.number]; return p && p.safe === pick.winner;
          });
          if (!usedBefore){
            lines.push({cat:"finaleBonus", label:"Never-Safe Finale Bonus", pick:null, correct:true, pts:200, max:200});
            categoryPts += 200;
          }
        }
      }

      var perfect = allCorrect;
      var perfectPts = 0;
      if (perfect){
        perfectPts = perfectBonus(ep);
        totals.perfectPicks += 1;
        lines.push({cat:"perfect", label:"Perfect Pick Bonus", pick:null, correct:true, pts:perfectPts, max:perfectPts});
      }

      var mvpBonus = 0;
      var mvpStreak = streaks[ep.number] || 0;
      if (pick.mvp && mvpStreak > 0){
        ["reward","immunity","votedOff","mystery"].forEach(function(cat){
          var arr = (ep.results && ep.results[cat]) || [];
          if (arr.indexOf(pick.mvp) !== -1){
            mvpBonus += mvpStreak * 10;
          }
        });
      }
      if (mvpBonus > 0){
        lines.push({cat:"mvp", label:"MVP Bonus ("+castawayName(pick.mvp)+" × "+mvpStreak+")", pick:pick.mvp, correct:true, pts:mvpBonus, max:mvpBonus});
      }

      var adj = (adjustments||[]).filter(function(a){return a.episodeNum === ep.number;})
        .reduce(function(s,a){return s + (a.delta||0);}, 0);
      if (adj !== 0){
        lines.push({cat:"adjustment", label:"Commissioner Adjustment", pick:null, correct:adj>=0, pts:adj, max:adj});
      }

      var subtotal = categoryPts + perfectPts + mvpBonus + adj;
      totals.points += subtotal;
      perEpisode.push({episode:ep.number, submitted:true, lines:lines, subtotal:subtotal, perfect:perfect, mvpBonus:mvpBonus, adjustment:adj, total:subtotal});
    });

    var lastLockedEp = sorted.filter(function(e){return e.locked;}).sort(function(a,b){return b.number-a.number;})[0];
    var finalMvpStreakValue = lastLockedEp ? (streaks[lastLockedEp.number]||0)*10 : 0;

    return {userId:userId, totals:totals, perEpisode:perEpisode, finalMvpStreakValue:finalMvpStreakValue, streaks:streaks};
  }

  function castawaysCol(){

            if ("eliminated" in partial) row.eliminated = partial.eliminated;
            if ("eliminatedEpisode" in partial) row.eliminated_episode = partial.eliminatedEpisode;
            var r = await sb.from("castaways").update(row).eq("id", id);

          }
        };

  function picksCollectionFor(profileId){
    function fromRow(row){
      return { episodeNum: row.episode_num, reward: row.reward, immunity: row.immunity, votedOff: row.voted_off,
        safe: row.safe, mystery: row.mystery, mvp: row.mvp, winner: row.winner, submittedAt: row.submitted_at };
    }
    function toRow(obj, epNum){
      return { profile_id: profileId, episode_num: epNum, reward: obj.reward, immunity: obj.immunity,
        voted_off: obj.votedOff, safe: obj.safe, mystery: obj.mystery || null, mvp: obj.mvp || null,
        winner: obj.winner || null, submitted_at: obj.submittedAt };
    }
    return {
      doc: function(epNumStr){
        var epNum = parseInt(epNumStr,10);
        return {
          get: async function(){
            var r = await sb.from("picks").select("*").eq("profile_id", profileId).eq("episode_num", epNum).maybeSingle();
            if (r.error) throw r.error;
            return { exists: !!r.data, data: function(){ return r.data ? fromRow(r.data) : undefined; } };
          },
          set: async function(obj){
            var row = toRow(obj, epNum);
            var r = await sb.from("picks").upsert(row, {onConflict:"profile_id,episode_num"});
            if (r.error) throw r.error;
          }
        };
      },
      get: async function(){
        var r = await sb.from("picks").select("*").eq("profile_id", profileId);
        if (r.error) throw r.error;
        return { docs: r.data.map(function(row){ return { id:String(row.episode_num), data:function(){ return fromRow(row); } }; }) };
      }
    };
  }

  function snapToMap(snap, mapper){
    var out = {};

  }

  async function loadShared(){
    try {

    try {
      var eSnap = await episodesCol().get();
      episodes = snapToMap(eSnap);
    } catch(e){ console.error("episodes load", e); }
    try {
      var pSnap = await playersCol().get();

    } catch(e){ console.error("players load", e); }

  function usedSafePicks(epNum){
    var win = safeWindow(epNum);
    var used = [];
    episodeList().forEach(function(e){
      if (e.number === epNum) return;
      if (safeWindow(e.number) !== win) return;
      var p = myPicksCache[e.number];
      if (p && p.safe) used.push(p.safe);
    });
    return used;
  }

  function mvpValueIfSelected(candidateId, priorMvp, priorStreak){
    var week = (candidateId === priorMvp && priorMvp) ? priorStreak + 1 : 1;
    return week * 10;
  }

  function mvpSection(draft, disabled, ep){
    var sec = el("div", {});
    var priorMvp = null, priorStreak = 0;
    var priorEpisodes = episodeList().filter(function(e){return e.number < ep.number;}).sort(function(a,b){return b.number-a.number;});
    if (priorEpisodes.length){
      var prevEp = priorEpisodes[0];
      var prevPick = myPicksCache[prevEp.number];
      if (prevPick && prevPick.mvp){
        priorMvp = prevPick.mvp;
        var streaks = mvpStreaks(episodeList().filter(function(e){return e.number<=prevEp.number;}), myPicksCache);
        priorStreak = streaks[prevEp.number] || 0;
      }
    }
    if (!draft.mvp && priorMvp) draft.mvp = priorMvp;

    sec.appendChild(el("label", {class:"field-label"}, ["Most Valuable Player"]));
    sec.appendChild(el("div", {class:"small muted", style:"margin-bottom:8px;"}, [
      priorMvp ? "Keep your pick to grow the streak, or switch to reset it to 10 pts." : "Pick your MVP to start earning streak bonuses."
    ]));
    sec.appendChild(renderGroupedChips(activeCastaways(), draft.mvp, disabled, function(c){
      draft.mvp = c.id; rerenderPicksForm(draft, ep);
    }, null, function(c){
      return mvpValueIfSelected(c.id, priorMvp, priorStreak)+" pts";
    }));

  async function savePick(ep, draft){
    var required = ["reward","immunity","votedOff","safe"];
    if (ep.mysteryQuestion) required.push("mystery");
    if (ep.isFinale) required.push("winner");
    for (var i=0;i<required.length;i++){
      if (!draft[required[i]]){ toast("Fill in: "+CAT_LABEL[required[i]], true); return; }
    }
    var body = {
      episodeNum: ep.number,
      reward: draft.reward, immunity: draft.immunity, votedOff: draft.votedOff,
      safe: draft.safe, mystery: draft.mystery || null, mvp: draft.mvp || null,
      winner: draft.winner || null,
      submittedAt: new Date().toISOString()
    };
    try {
      await myPicksCol().doc(String(ep.number)).set(body);
      myPicksCache[ep.number] = body;
      toast("Picks saved.");
      render();
    } catch(e){
      toast("Couldn't save: "+(e.message||e.code||"unknown error"), true);
    }
  }

  async function loadLeaderboard(force){
    if (leaderboardLoading) return;
    if (leaderboardData && !force) return;
    leaderboardLoading = true;
    render();
    try {
      var ids = Object.keys(players);
      var sortedEps = episodeList().sort(function(a,b){return b.number-a.number;});
      var results = await Promise.all(ids.map(async function(uid){
        var snap = await picksColFor(uid).get();
        var picksByEp = {};
        snap.docs.forEach(function(d){ var data = d.data(); picksByEp[data.episodeNum] = data; });
        var adjSnap = await adjustmentsCol().where("userId","==",uid).get();
        var adjustments = adjSnap.docs.map(function(d){return d.data();});
        var score = scorePlayer(uid, picksByEp, adjustments);
        var mvpNow = null;
        for (var j=0;j<sortedEps.length;j++){
          var p = picksByEp[sortedEps[j].number];
          if (p && p.mvp){ mvpNow = p.mvp; break; }
        }
        score.mvpNow = mvpNow;
        return score;
      }));
      leaderboardData = results;
    } catch(e){
      toast("Couldn't load leaderboard: "+(e.message||e.code), true);
    }
    leaderboardLoading = false;
    render();
  }

  function prCard(line){
    var pickId = line.pick;
    var isNoPick = !pickId || pickId === NO_PICK;
    var c = isNoPick ? null : castaways[pickId];
    var avatar = el("span", {class:"pr-avatar"},
      c && c.photo ? [el("img", {src:c.photo, alt:""})] : [document.createTextNode(isNoPick ? "–" : (c ? c.name.charAt(0) : "?"))]
    );
    var label = isNoPick ? "No Pick" : (c ? c.name : "?");
    if (line.correct) label += ": " + line.pts + "pts";
    return el("span", {class:"pr-card "+(line.correct?"correct":"incorrect")}, [
      el("span", {class:"pr-cat"}, [CAT_SHORT[line.cat] || ""]),
      avatar,
      document.createTextNode(label)

  function fillPlayerRows(container, ep){
    container.innerHTML = "";
    var rows = leaderboardData.map(function(score){
      var row = score.perEpisode.filter(function(r){return r.episode===ep.number;})[0];
      return row ? {userId:score.userId, row:row} : null;
    }).filter(Boolean);
    rows.sort(function(a,b){return b.row.total - a.row.total;});
    rows.forEach(function(entry){
      var name = (players[entry.userId]&&players[entry.userId].name) || "Someone";

      prRow.appendChild(el("div", {class:"pr-player"}, [name]));

        var mvpLine = entry.row.lines.filter(function(l){ return l.cat === "mvp"; })[0];

          var mc = mvpLine.pick ? castaways[mvpLine.pick] : null;

        entry.row.lines.filter(function(l){ return EPISODE_CATS.indexOf(l.cat) !== -1; }).forEach(function(l){

      container.appendChild(prRow);
    });
  }

      await castawaysCol().doc(c.id).update({eliminated: nowOut, eliminatedEpisode: epNum ? parseInt(epNum,10) : null});
      await loadShared();
    } catch(e){ toast("Update failed: "+(e.message||e.code), true); }
  }

  function renderAdminNewEpisode(){
    var card = el("div", {class:"card admin-section"});
    card.appendChild(el("h2", {}, ["Open a New Episode"]));
    var nextNum = episodeList().reduce(function(m,e){return Math.max(m,e.number);}, 0) + 1;

    var numInput = el("input", {class:"native", type:"number", value:String(nextNum)});
    var deadlineInput = el("input", {class:"native", type:"datetime-local"});
    var questionInput = el("textarea", {class:"native", rows:"2", placeholder:"Mystery Question for this episode (optional)"});
    var mergedCheck = el("input", {type:"checkbox"});
    var finaleCheck = el("input", {type:"checkbox"});

    var grid = el("div", {class:"form-grid"});
    grid.appendChild(el("div", {}, [el("label",{class:"field-label"},["Episode #"]), numInput]));
    grid.appendChild(el("div", {}, [el("label",{class:"field-label"},["Picks Deadline"]), deadlineInput]));
    card.appendChild(grid);
    card.appendChild(el("div", {style:"margin:14px 0;"}, [el("label",{class:"field-label"},["Mystery Question"]), questionInput]));
    card.appendChild(el("div", {class:"row", style:"margin-bottom:14px;"}, [
      el("label", {class:"row small"}, [mergedCheck, " Post-merge (higher point values)"]),
      el("label", {class:"row small"}, [finaleCheck, " This is the Finale"])
    ]));
    card.appendChild(el("button", {class:"btn primary", onclick: function(){
      createEpisode({
        number: parseInt(numInput.value,10),
        picksDeadline: deadlineInput.value ? new Date(deadlineInput.value).toISOString() : null,
        mysteryQuestion: questionInput.value.trim() || null,
        merged: mergedCheck.checked,
        isFinale: finaleCheck.checked
      });
    }}, ["Create Episode"]));
    return card;
  }

  async function createEpisode(data){
    if (!data.number || !data.picksDeadline){ toast("Episode number and deadline are required.", true); return; }
    try {
      await episodesCol().doc(String(data.number)).set({
        number: data.number, picksDeadline: data.picksDeadline, mysteryQuestion: data.mysteryQuestion,
        merged: data.merged, isFinale: data.isFinale, locked: false, results: null
      });
      toast("Episode "+data.number+" opened.");
      await loadShared();
    } catch(e){ toast("Failed: "+(e.message||e.code), true); }
  }

  function renderAdminResults(){
    var card = el("div", {class:"card admin-section"});
    card.appendChild(el("h2", {}, ["Enter Results"]));
    var unlocked = episodeList().filter(function(e){return !e.locked;});
    var locked = episodeList().filter(function(e){return e.locked;});
    if (!unlocked.length){
      card.appendChild(el("p", {class:"small muted"}, ["No open episodes to score."]));
      card.appendChild(renderLockedEpisodesList(locked));
      return card;
    }
    var select = el("select", {class:"native"});
    unlocked.forEach(function(e){
      select.appendChild(el("option", {value:e.number}, ["Episode "+e.number]));
    });
    if (adminSelectedEpisode == null) adminSelectedEpisode = unlocked[0].number;
    select.value = adminSelectedEpisode;
    select.onchange = function(){ adminSelectedEpisode = parseInt(select.value,10); resultsDraft = {}; render(); };
    card.appendChild(el("div", {style:"margin-bottom:14px;"}, [el("label",{class:"field-label"},["Episode"]), select]));

    var ep = episodes[String(adminSelectedEpisode)];
    if (!ep) return card;

    var draft = resultsDraft;
    if (!draft._loadedFor || draft._loadedFor !== ep.number){
      draft = {_loadedFor: ep.number, reward:[], immunity:[], votedOff:[], mystery:[], winner:null};
      resultsDraft = draft;
    }

    ["reward","immunity","votedOff"].concat(ep.mysteryQuestion?["mystery"]:[]).forEach(function(cat){
      card.appendChild(resultPicker(cat, draft));
    });
    if (ep.isFinale){
      card.appendChild(el("label", {class:"field-label"}, ["Sole Survivor"]));
      card.appendChild(renderGroupedChips(allCastaways(), draft.winner, false, function(c){
        draft.winner = c.id; render();
      }));
    }

    card.appendChild(el("div", {class:"row"}, [
      el("button", {class:"btn primary", onclick:function(){ lockEpisode(ep, draft); }}, ["Lock & Score Episode "+ep.number])
    ]));
    card.appendChild(renderLockedEpisodesList(locked));
    return card;
  }

  function renderLockedEpisodesList(locked){
    if (!locked.length) return el("div", {});
    var wrap = el("div", {style:"margin-top:20px; padding-top:16px; border-top:1px solid var(--border);"});
    wrap.appendChild(el("label", {class:"field-label"}, ["Scored Episodes"]));
    locked.sort(function(a,b){return b.number-a.number;}).forEach(function(e){
      wrap.appendChild(el("div", {class:"row between", style:"padding:6px 0;"}, [
        el("span", {class:"small"}, ["Episode "+e.number]),
        el("button", {class:"btn sm", onclick:function(){ unlockEpisode(e); }}, ["Unlock to Edit"])
      ]));
    });
    return wrap;
  }

  async function unlockEpisode(ep){
    if (!confirm("Unlock Episode "+ep.number+"? Scores will recompute once you re-lock it.")) return;
    try {
      await episodesCol().doc(String(ep.number)).update({locked:false});
      adminSelectedEpisode = ep.number;
      resultsDraft = {
        _loadedFor: ep.number,
        reward: (ep.results && ep.results.reward) || [],
        immunity: (ep.results && ep.results.immunity) || [],
        votedOff: (ep.results && ep.results.votedOff) || [],
        mystery: (ep.results && ep.results.mystery) || [],
        winner: (ep.results && ep.results.winner) || null
      };
      toast("Episode "+ep.number+" unlocked.");
      leaderboardData = null;
      await loadShared();
    } catch(e){ toast("Failed: "+(e.message||e.code), true); }
  }

  function resultPicker(cat, draft){
    var sec = el("div", {style:"margin-bottom:16px;"});
    sec.appendChild(el("label", {class:"field-label"}, [CAT_LABEL[cat] + " — who won? (select none for No Pick)"]));
    groupByTribe(allCastaways()).forEach(function(group){
      var gWrap = el("div", {class:"tribe-group"});
      gWrap.appendChild(el("div", {class:"tribe-heading"}, [
        el("span", {class:"dot", style:"background:"+tribeColor(group.tribe)}),
        group.tribe || "No Tribe"
      ]));
      var grid = el("div", {class:"chip-grid"});
      group.members.forEach(function(c){
        var selected = draft[cat].indexOf(c.id) !== -1;
        grid.appendChild(el("button", {
          class:"chip"+(selected?" selected":"")+(c.eliminated?" eliminated":""),
          onclick:function(){
            var i = draft[cat].indexOf(c.id);
            if (i===-1) draft[cat].push(c.id); else draft[cat].splice(i,1);
            render();
          }
        }, [avatarEl(c), c.name]));
      });
      gWrap.appendChild(grid);
      sec.appendChild(gWrap);
    });
    return sec;
  }

  async function lockEpisode(ep, draft){
    if (ep.isFinale && !draft.winner){ toast("Pick the Sole Survivor before locking the finale.", true); return; }
    if (!confirm("Lock Episode "+ep.number+"? This scores everyone's picks. You can unlock later to correct mistakes.")) return;
    try {
      await episodesCol().doc(String(ep.number)).update({
        locked: true,
        results: {reward:draft.reward, immunity:draft.immunity, votedOff:draft.votedOff, mystery:draft.mystery||[], winner:draft.winner||null}
      });
      toast("Episode "+ep.number+" scored.");
      leaderboardData = null;
      resultsDraft = {};
      await loadShared();
    } catch(e){ toast("Failed: "+(e.message||e.code), true); }
  }

  function renderAdminAdjustments(){
    var card = el("div", {class:"card admin-section"});
    card.appendChild(el("h2", {}, ["Manual Adjustment"]));
    card.appendChild(el("p", {class:"small muted"}, ["For disputes or one-off rulings. Applies to a player's total for a given episode."]));

    var playerSelect = el("select", {class:"native"});
    Object.keys(players).forEach(function(uid){
      playerSelect.appendChild(el("option", {value:uid}, [players[uid].name || uid]));
    });
    var epSelect = el("select", {class:"native"});
    episodeList().forEach(function(e){ epSelect.appendChild(el("option", {value:e.number}, ["Episode "+e.number])); });
    var deltaInput = el("input", {class:"native", type:"number", placeholder:"e.g. 50 or -25"});
    var noteInput = el("input", {class:"native", type:"text", placeholder:"Reason"});

    var grid = el("div", {class:"form-grid"});
    grid.appendChild(el("div", {}, [el("label",{class:"field-label"},["Player"]), playerSelect]));
    grid.appendChild(el("div", {}, [el("label",{class:"field-label"},["Episode"]), epSelect]));
    grid.appendChild(el("div", {}, [el("label",{class:"field-label"},["Points (+/-)"]), deltaInput]));
    grid.appendChild(el("div", {}, [el("label",{class:"field-label"},["Note"]), noteInput]));
    card.appendChild(grid);
    card.appendChild(el("button", {class:"btn primary", style:"margin-top:14px;", onclick:function(){
      addAdjustment(playerSelect.value, parseInt(epSelect.value,10), parseInt(deltaInput.value,10), noteInput.value);
    }}, ["Apply Adjustment"]));
    return card;
  }

  async function addAdjustment(uid, epNum, delta, note){
    if (!uid || !epNum || isNaN(delta)){ toast("Fill in all fields.", true); return; }
    try {
      await adjustmentsCol().add({userId:uid, episodeNum:epNum, delta:delta, note:note||"", createdAt:new Date().toISOString()});
      toast("Adjustment applied.");
      leaderboardData = null;
      render();
    } catch(e){ toast("Failed: "+(e.message||e.code), true); }
  }

  /* boot */
  init();
})();
</script>
</body>
</html>
